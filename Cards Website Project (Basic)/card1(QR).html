<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            /* min-height: 760px; */
            background: #ff0571;
            background: radial-gradient(circle, rgba(255, 5, 113, 1) 0%, rgba(148, 187, 233, 1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .card{
            width: 360px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .card img{
            height: 60%;
            border-radius: 20px;
        }
        .card h2{
            font-weight: bold;
            font-size: 1.5rem;
        }
        .card p{
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <img src="Qr linkdin.jpeg"/>
            <h2>Checkout my Linkdin Profile</h2>
            <p> I'm a 3rd-year B.Tech CSE Student in PCET's Pimpri Chinchwad University, Pune with a real passion for software engineering.I'm always eager to learn something new.Let's connect and explore the exciting world of technology together! </p>
        </div>
    </div>
    
</body>
</html>
