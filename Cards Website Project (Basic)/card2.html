<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second card</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            /* min-height: 760px; */
            background: #ff0571;
            background: radial-gradient(circle, rgba(255, 5, 113, 1) 0%, rgba(148, 187, 233, 1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .card{
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .card img{
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .textBox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 75%;
            text-align: center;
        }
        #amountBox{
            width: 80%;
            height: 10%;
           background-color: rgb(130, 204, 247);
           border-radius: 10px;
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding-right: 20px;
           padding-left: 20px;
        }
        #leftBox{
            /* width: fit-content; */
            height: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .imgBox img{
            height: 3.5rem;
            width: 3.5rem;
        }
        /* .rightBox{

        } */
        #paymentButton{
            width: 80%;
            height: 9%;
            background-color: rgb(7, 7, 104);
            color: white;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.45) 0px 25px 20px -20px;
        }
        .cancelBox a{
            text-decoration: none;
            color: rgba(99, 54, 54, 0.658) ;
            font-weight: bold;
            font-size: large;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <img src="Tech-futur.png"/>

            <div class="textBox">
                <h2>
                Order Summary
            </h2>
            <p>
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Neque eius minus distinctio iste impedit obcaecati veritatis dolorem porro delectus ipsam!
            </p>
            </div>

            <div id="amountBox">
                <div id="leftBox">
                    <div class="imgBox">
                        <img src="Music_logo.png"/>
                    </div>
                    <div class="textAmountBox">
                        <p>
                            Amount
                        </p>
                        <p>$99.9/year</p>
                    </div>
                </div>

                <div class="rightBox">
                    <a href="#">Change</a>
                </div>

            </div>
            
            <button id="paymentButton">
                Proces  s to Payment
            </button>

            <div class="cancelBox">
                <a href="#">Cancel Order</a>
            </div>
        </div>
    </div>
    
</body>
</html>
